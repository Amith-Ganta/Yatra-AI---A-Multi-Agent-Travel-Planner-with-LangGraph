name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://yatra:yatra_password@localhost:5432/yatra_ai
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # requirements-eval.txt is requirements.txt plus DeepEval, so the eval suite's tests run too.
      - name: Install Python deps
        run: pip install -q -r requirements-eval.txt

      - name: Tier 1 — Docker build
        run: docker compose build

      - name: Tier 1 — Start containers
        run: docker compose up -d

      # The API waits for Postgres and applies migrations on startup, so poll /ready
      # (503 until the database answers) instead of sleeping a fixed time.
      - name: Tier 1 — /health check
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://localhost:8000/ready
          curl -fsS http://localhost:8000/health

      - name: Tier 1 — Stop containers
        if: always()
        run: docker compose down || true

      - name: Tier 2 — Unit tests
        run: pytest tests/unit -q --tb=short

      - name: Tier 3 — Frontend build
        run: |
          cd frontend
          rm -rf .next node_modules package-lock.json
          npm install
          npm run build
